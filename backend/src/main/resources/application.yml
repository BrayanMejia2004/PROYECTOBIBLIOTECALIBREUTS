server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/xml,text/plain,text/html
    min-response-size: 1024

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

rate-limit:
  auth:
    max-attempts: 5
    window-minutes: 15
  register:
    max-attempts: 3
    window-minutes: 60
  general:
    max-requests: 100
    window-minutes: 1

spring:
  application:
    name: biblioteca-uts
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mongodb:
    uri: mongodb://localhost:27017/biblioteca_uts

logging:
  level:
    "[com.uts.biblioteca]": DEBUG
    "[org.springframework.data.mongodb]": DEBUG
    "[org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer]": ERROR

---
spring:
  config:
    activate:
      on-profile: prod
  mongodb:
    uri: ${MONGODB_URI}

logging:
  level:
    "[com.uts.biblioteca]": INFO
    "[org.springframework.data.mongodb]": WARN
    "[org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer]": ERROR
